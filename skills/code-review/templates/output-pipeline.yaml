# Output Template: Pipeline Stage
#
# Use this template when code-review is invoked as a pipeline stage
# Only one section is run, findings scoped to that section

security_review:  # or type_safety_review, lint_review, standards_review
  # Metadata
  timestamp: "2026-01-31T12:00:00Z"  # ISO 8601 format
  section: security  # security | type_safety | linting | standards
  framework: react  # Detected or overridden framework

  # Files reviewed (consumed by Stop hook for per-file pipeline-recursion suppression).
  # Required field — must be a list of paths relative to ${CLAUDE_PROJECT_DIR}.
  # Empty list `[]` is valid if pipeline ran but covered no specific files.
  # Missing field disables suppression for this log (strict mode).
  reviewed_files:
    - src/auth/token.ts
    - src/api/users.ts

  # Language applicability (P10.21) — this reviewer's per-file decision for ITS
  # single section. ReviewSynthesizer (Stage 5) aggregates the 4 reviewer logs
  # into the consolidated language_applicability (sections_applied / sections_skipped)
  # in the direct-invocation diagnostic.
  language_applicability:
    - file: src/api/handler.ts
      detected_language: typescript
      section: security
      decision: applied        # applied | partial | skipped
    - file: scripts/deploy.sh
      detected_language: bash
      section: security
      decision: applied
      # A type_safety stage reviewing this bash file would instead record:
      #   decision: skipped
      #   skip_rationale: "Bash has no static type system"

  # Followup edits expected (P10.22 — consumed by Stop hook grace-window logic).
  # Optional field — emit per-file when this section produced at least one
  # critical or important finding. Subsequent edits to a listed file within
  # grace_window_seconds of this log being written are treated as pre-covered.
  # ReviewSynthesizer (Stage 5) aggregates this field across all 4 reviewer logs:
  # union by file, max grace_window_seconds, union of finding_ids.
  followup_edits_expected:
    - file: src/auth/token.ts
      grace_window_seconds: 1800
      finding_ids: [SEC-001]
      rationale: "1 critical (SQL injection); user-applied fix expected within grace"
    - file: src/api/users.ts
      grace_window_seconds: 1800
      finding_ids: [SEC-002]
      rationale: "1 important (missing auth check)"

  # Findings for this section only
  findings:
    - severity: critical  # critical | important | suggestion
      confidence: verified  # verified | suspected
      file: src/auth/token.ts
      line: 45
      column: 12  # Optional
      pattern: sql_injection
      owasp: "A03:2021-Injection"  # For security section
      evidence: "User input from req.query.id flows to db.query() at line 45 without sanitization"
      description: "User input concatenated into SQL query"
      why: "Allows attacker to execute arbitrary SQL commands"
      fix: "Use parameterized query: db.query('SELECT * FROM users WHERE id = ?', [userId])"

    - severity: important
      confidence: suspected
      file: src/api/users.ts
      line: 88
      pattern: missing_auth_check
      owasp: "A01:2021-Broken Access Control"
      evidence: "Database query at line 88 with no preceding authorization check in function"
      description: "Resource accessed without ownership verification"
      why: "User could access resources belonging to other users"
      fix: "Add ownership check: if (resource.ownerId !== currentUser.id) throw new ForbiddenError()"

  # Summary for this section
  summary: "1 critical and 1 important security finding. SQL injection requires immediate fix."

  # Statistics
  stats:
    total_findings: 2
    by_severity:
      critical: 1
      important: 1
      suggestion: 0
    by_confidence:
      verified: 1
      suspected: 1

  # Pass/fail for pipeline gating
  gate:
    passed: false  # false if any critical findings
    blocking_findings: 1  # Count of critical findings
    recommendation: "Block merge until SQL injection is fixed"

